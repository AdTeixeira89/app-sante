name: Android build

# Compila a app Android na nuvem (não é preciso computador nem Android Studio).
# O ficheiro gerado fica em: separador "Actions" → execução → "Artifacts".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Preparar a app web e sincronizar com o projeto Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: kinly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Pacote para o Play Store (só corre quando as 4 chaves de assinatura estiverem configuradas
      # em Settings → Secrets and variables → Actions).
      - name: Compilar pacote assinado (release, .aab)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Guardar o pacote assinado
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: kinly-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
